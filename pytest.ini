[pytest]
asyncio_mode = auto
testpaths = tests
addopts = -ra --strict-markers
python_files = test_*_unit.py test_*_properties.py
markers =
    asyncio: mark a test as asyncio-enabled.
    slow: marks tests as slow (deselect with '-m \"not slow\"')
    smoke: fast PR gate tests
filterwarnings =
    ignore::DeprecationWarning
